{% extends "base.html" %}

{% block content %}
<style>
    /* Home Page Specific Styling targeting parsed markdown */
    .home-container {
        margin-bottom: 40px;
    }
    
    .home-container h1 {
        font-size: 2.5rem;
        color: var(--text-bright);
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 10px;
    }

    .home-container p {
        font-size: 1.15rem;
        line-height: 1.6;
        color: var(--text-dim);
        margin-bottom: 30px;
        max-width: 800px;
    }

    .home-container strong {
        color: var(--accent);
    }

    .home-container h2 {
        color: var(--contrast);
        font-size: 1.2rem;
        margin-top: 40px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .home-container ul {
        list-style-type: none;
        padding-left: 0;
        margin-bottom: 20px;
    }

    .home-container li {
        color: #666;
        margin-bottom: 8px;
    }
    
    .home-container li::before {
        content: "> ";
        color: var(--contrast);
    }

    .home-container blockquote {
        color: var(--amber, #ffb000);
        font-weight: bold;
        background: rgba(255, 176, 0, 0.1);
        padding: 10px;
        border-radius: 4px;
        border-left: 2px solid var(--amber, #ffb000);
        margin: 0;
    }
</style>

<div class="home-container" role="main" aria-label="Home Landing Page">
    {{ content | safe }}

    <div class="social-grid" role="list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px;">
        <a href="https://linkedin.com/in/michael-robberts" class="social-card active" role="listitem" aria-label="LinkedIn profile (Active Link)" style="display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(0, 243, 255, 0.05); border: 1px solid var(--accent); border-radius: 6px; text-decoration: none;">
            <span class="social-icon" aria-hidden="true" style="font-size: 1.5rem;">💼</span>
            <div>
                <span class="social-name" style="color: var(--text-bright); font-weight: bold; font-family: monospace;">LinkedIn</span>
                <span class="social-status" style="font-size: 0.75rem; color: var(--text-dim); display: block; margin-top: 4px;">ACTIVE // CONNECTION_OPEN</span>
            </div>
        </a>

        <div class="social-card locked" role="listitem" aria-label="ProtonMail (Coming Soon)" style="opacity: 0.4; cursor: not-allowed; display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 6px;">
            <span class="social-icon" aria-hidden="true" style="font-size: 1.5rem;">📧</span>
            <div>
                <span class="social-name" style="color: var(--text-bright); font-weight: bold; font-family: monospace;">ProtonMail</span>
                <span class="social-status" style="font-size: 0.75rem; color: var(--text-dim); display: block; margin-top: 4px;">COMING SOON</span>
            </div>
        </div>

        <div class="social-card locked" role="listitem" aria-label="YouTube (Coming Soon)" style="opacity: 0.4; cursor: not-allowed; display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 6px;">
            <span class="social-icon" aria-hidden="true" style="font-size: 1.5rem;">▶️</span>
            <div>
                <span class="social-name" style="color: var(--text-bright); font-weight: bold; font-family: monospace;">YouTube</span>
                <span class="social-status" style="font-size: 0.75rem; color: var(--text-dim); display: block; margin-top: 4px;">COMING SOON</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
