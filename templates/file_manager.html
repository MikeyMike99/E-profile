<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHITECT_OS // WORKSTATION</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/file_manager.css') }}">
</head>

<body data-project="{{ project_name }}">

    <header class="workstation-header">
        <div class="path-display">
            <span class="label">SYSTEM_PATH:</span>
            <strong id="current-path-display">/{{ project_name }}</strong>
        </div>
        <div class="system-status" onclick="toggleTerminal()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTerminal();}" style="cursor: pointer;" title="Toggle CLI Terminal (CTRL+ALT+T or ALT+T)" role="button" tabindex="0" aria-label="Toggle CLI Terminal (Shortcut: Ctrl+Alt+T or Alt+T)" aria-keyshortcuts="Control+Alt+T Alt+T">
            <span class="pulse-icon"></span>
            <span class="hint">CTRL+ALT+T or ALT+T // CLI_ACCESS</span>
        </div>
    </header>

    <main class="scroll-container" id="explorer-view">
        <div class="loading-state">INITIALIZING_FS_STREAM...</div>
    </main>

    <div id="terminal-overlay" role="region" aria-label="Interactive CLI Terminal">
        <div id="terminal-output" aria-live="polite" aria-atomic="false"></div>
        <div class="terminal-input-row">
            <label for="terminal-input" id="terminal-prompt" class="terminal-prompt-label">root@architect:~$</label>
            <input type="text" id="terminal-input" spellcheck="false" autocomplete="off" aria-label="Terminal command input" aria-describedby="terminal-prompt">
        </div>
    </div>

    <!-- Screen Reader Live Announcer -->
    <div id="sr-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <footer class="footer">
        <div class="auth-info">
            ENCRYPTED_SESSION_ACTIVE // {{ 'ADMIN' if role == 'admin' else 'EMPLOYER' }}
        </div>
        <div class="version-info">BUILD_v2.8.5.LOCKED</div>
    </footer>

    <script src="{{ url_for('static', filename='js/file_manager.js') }}"></script>
</body>

</html>
