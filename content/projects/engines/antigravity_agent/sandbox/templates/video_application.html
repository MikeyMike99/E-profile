<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ui.media_player.title_tag }}</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --surface-color: #2a2a3c;
            --text-primary: #f8f8f2;
            --text-secondary: #a1a1aa;
            --accent-color: #bd93f9;
            --button-bg: #44475a;
            --button-hover: #6272a4;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: var(--accent-color);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
            margin-bottom: 15px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            /* Hide native controls from screen readers so they use our accessible ones */
        }
        
        /* Custom Accessible Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #191a21;
            padding: 15px;
            border-radius: 8px;
        }
        button, select {
            background-color: var(--button-bg);
            color: var(--text-primary);
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover, select:hover {
            background-color: var(--button-hover);
        }
        button:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(189, 147, 249, 0.3);
        }
        .scrubber-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }
        .time-display {
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
            min-width: 100px;
            text-align: right;
        }
        .description {
            margin-top: 20px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
            padding-top: 15px;
            border-top: 1px solid #44475a;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .playlist-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #44475a;
        }
        .playlist-section h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 10px;
        }
        .playlist-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--button-bg);
            border-radius: 6px;
        }
        .playlist-item[aria-current="true"] {
            background: var(--button-hover);
            border-left: 4px solid var(--accent-color);
        }
        .playlist-item-title {
            flex-grow: 1;
            margin-right: 15px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-remove {
            background: #ff5555;
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .btn-remove:hover {
            background: #ff6e6e;
        }
    </style>
</head>
<body>
    <main class="player-container" aria-label="Media Player Application">
        <h1 id="videoTitle" tabindex="-1">{{ video_title }}</h1>
        
        <div class="video-wrapper" aria-hidden="true">
            <div id="ytplayer"></div>
        </div>

        <div id="errorFallback" class="error-fallback" style="display:none; background:#282a36; padding:15px; border-radius:8px; border:2px solid #ff5555; margin-bottom:15px;" role="region" aria-label="Playback Error">
            <h3 id="errorHeading" tabindex="-1" style="color:#ff5555; margin-top:0;">Content Restricted</h3>
            <p>The creator of this video has disabled embedding. You can safely watch it directly on YouTube.</p>
            <a id="btnFallbackWatch" href="#" target="_blank" rel="noopener noreferrer" style="display:inline-block; background:#ff5555; color:white; padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:bold; margin-top:10px;">Watch on YouTube</a>
        </div>

        <section class="controls" aria-label="Video Controls">
            <div class="scrubber-container">
                <label for="scrubber" class="sr-only">Video Progress</label>
                <input type="range" id="scrubber" min="0" max="100" value="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="time-display" id="timeDisplay" aria-hidden="true">0:00 / 0:00</div>
            </div>
            
            <button id="btnPlayPause" aria-label="{{ ui.media_player.btn_play_aria }}" accesskey="k">{{ ui.media_player.btn_play }}</button>
            <button id="btnRewind" aria-label="{{ ui.media_player.btn_rewind_aria }}">{{ ui.media_player.btn_rewind }}</button>
            <button id="btnForward" aria-label="{{ ui.media_player.btn_forward_aria }}">{{ ui.media_player.btn_forward }}</button>
            
            <label for="speedSelect" class="sr-only">Playback Speed</label>
            <select id="speedSelect" title="Playback Speed">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x Normal</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2">2x</option>
            </select>
            
            <button id="btnFullscreen" aria-label="{{ ui.media_player.btn_fullscreen_aria }}">{{ ui.media_player.btn_fullscreen }}</button>
            
            <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                <input type="checkbox" id="chkAutoplay" checked aria-label="Toggle Autoplay">
                <span>Autoplay</span>
            </label>
        </section>

        <div class="description" aria-live="polite">
            <!-- DESCRIPTION_PLACEHOLDER -->
            <p>Video Description</p>
        </div>
        
        <section class="playlist-section" aria-labelledby="playlistHeading">
            <h2 id="playlistHeading">Up Next</h2>
            <ul id="playlistList" class="playlist-list" role="list">
                <!-- Dynamically populated -->
            </ul>
        </section>
    </main>

    <!-- Load YouTube Iframe API Dynamically -->
    <script>
        // --- MINIMAL MODE ---
        const urlParams = new URLSearchParams(window.location.search);
        const isMinimal = urlParams.get('minimal') === 'true';
        if (isMinimal) {
            document.querySelector('.playlist-section').style.display = 'none';
            document.querySelector('.description').style.display = 'none';
            document.querySelector('#videoTitle').style.display = 'none';
        }

        // --- TELEMETRY ---
        function logToAgent(msg) {
            const line = `[${new Date().toISOString()}] ${msg}`;
            fetch('/api/artifacts/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: 'client_debug.txt', content: line + '\n', append: true })
            }).catch(e => {});
        }
        window.onerror = function(msg, url, line) { logToAgent(`ERROR: ${msg} at ${line}`); return false; };
        const oldErr = console.error; console.error = function(...args) { logToAgent(`CONSOLE_ERR: ${args.join(' ')}`); oldErr.apply(console, args); };
        
        document.addEventListener("securitypolicyviolation", (e) => {
            logToAgent(`CSP VIOLATION: ${e.violatedDirective} blocked ${e.blockedURI}`);
        });

        logToAgent("video_application.html loaded, API script requested.");

        // Data injected by Agent
        const VIDEO_ID = {{ video_id | default("jNQXAC9IVRw") | tojson | safe }};
        
        // Inject YouTube API script dynamically so logging is attached first
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        
        let player;
        let isPlaying = false;
        let scrubberInterval;
        
        const startParam = parseInt(urlParams.get('start')) || 0;
        
        let currentVideoId = VIDEO_ID;
        
        // Playlist State & UI
        let playlistData = [];
        let playlistIds = [currentVideoId];
        let currentIndex = 0;

        function renderPlaylist() {
            const listEl = document.getElementById('playlistList');
            if (listEl.children.length === playlistData.length) {
                // Just update aria-current to prevent screen reader from reading everything at once
                Array.from(listEl.children).forEach((li, index) => {
                    if (index === currentIndex) {
                        li.setAttribute('aria-current', 'true');
                    } else {
                        li.removeAttribute('aria-current');
                    }
                });
                return;
            }

            listEl.innerHTML = '';
            playlistData.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'playlist-item';
                if (index === currentIndex) {
                    li.setAttribute('aria-current', 'true');
                }
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'playlist-item-title';
                titleSpan.textContent = `${index + 1}. ${item.title}`;
                titleSpan.setAttribute('role', 'button');
                titleSpan.setAttribute('tabindex', '0');
                titleSpan.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    currentVideoId = item.id;
                    currentIndex = index;
                    document.getElementById('videoTitle').textContent = item.title;
                    document.getElementById('errorFallback').style.display = 'none';
                    if (player && typeof player.loadVideoById === 'function') {
                        logToAgent(`Loading video ${currentVideoId} via click`);
                        player.loadVideoById(currentVideoId);
                    } else {
                        logToAgent(`Cannot load video: player ready? ${!!player}, has method? ${player && typeof player.loadVideoById}`);
                    }
                    renderPlaylist();
                });
                titleSpan.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        e.stopPropagation();
                        currentVideoId = item.id;
                        currentIndex = index;
                        document.getElementById('videoTitle').textContent = item.title;
                        document.getElementById('errorFallback').style.display = 'none';
                        if (player && typeof player.loadVideoById === 'function') {
                            logToAgent(`Loading video ${currentVideoId} via keydown`);
                            player.loadVideoById(currentVideoId);
                        } else {
                            logToAgent(`Cannot load video: player ready? ${!!player}, has method? ${player && typeof player.loadVideoById}`);
                        }
                        renderPlaylist();
                    }
                });

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn-remove';
                removeBtn.textContent = 'Remove';
                removeBtn.setAttribute('aria-label', `Remove ${item.title} from playlist`);
                removeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    playlistData.splice(index, 1);
                    playlistIds = playlistData.map(p => p.id);
                    currentIndex = playlistIds.indexOf(currentVideoId);
                    if(currentIndex === -1) currentIndex = 0;
                    
                    // Force full re-render on removal
                    listEl.innerHTML = ''; 
                    renderPlaylist();
                    
                    fetch('/api/artifacts/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            path: '/mnt/c/Users/michael/Documents/devcore/sandbox/static/playlist.json',
                            content: JSON.stringify(playlistData, null, 4),
                            append: false
                        })
                    }).catch(e => logToAgent(`Failed to save playlist: ${e.message}`));
                });

                li.appendChild(titleSpan);
                li.appendChild(removeBtn);
                listEl.appendChild(li);
            });
        }

        function loadPlaylist() {
            // Cache bust the JSON fetch to prevent browser from restoring deleted items
            fetch('/static/playlist.json?t=' + new Date().getTime())
                .then(r => r.json())
                .then(data => {
                    // Only re-render if data changed to prevent UI flicker
                    if (JSON.stringify(data) !== JSON.stringify(playlistData)) {
                        playlistData = data;
                        playlistIds = data.map(item => item.id);
                        let newIndex = playlistIds.indexOf(currentVideoId);
                        if (newIndex !== -1) {
                            currentIndex = newIndex;
                        } else if (currentIndex >= playlistIds.length) {
                            currentIndex = 0;
                        }
                        renderPlaylist();
                    }
                })
                .catch(err => logToAgent(`Failed to load playlist.json: ${err.message}`));
        }
        
        loadPlaylist();
        setInterval(loadPlaylist, 3000);

        function onYouTubeIframeAPIReady() {
            logToAgent("onYouTubeIframeAPIReady fired!");
            const autoplay = document.getElementById('chkAutoplay').checked ? 1 : 0;
            
            try {
                player = new YT.Player('ytplayer', {
                    height: '100%',
                    width: '100%',
                    videoId: currentVideoId,
                    playerVars: {
                        'playsinline': 1,
                        'controls': 0,
                        'disablekb': 1,
                        'rel': 0,
                        'autoplay': autoplay,
                        'origin': window.location.origin,
                        'start': startParam
                    },
                    events: {
                        'onReady': (e) => { logToAgent("Player onReady fired!"); onPlayerReady(e); },
                        'onStateChange': (e) => { logToAgent(`Player State Change: ${e.data}`); onPlayerStateChange(e); },
                        'onError': (e) => { 
                            logToAgent(`Player Error: ${e.data}`); 
                            if (e.data === 101 || e.data === 150) {
                                document.getElementById('errorFallback').style.display = 'block';
                                const fbLink = document.getElementById('btnFallbackWatch');
                                fbLink.href = `https://www.youtube.com/watch?v=${currentVideoId}`;
                                document.getElementById('errorHeading').focus();
                            }
                        }
                    }
                });
            } catch (err) {
                logToAgent(`FATAL: ${err.message}`);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        let lastSyncTime = 0;
        function updateScrubber() {
            if (player && player.getCurrentTime) {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                const scrubber = document.getElementById('scrubber');
                const timeDisplay = document.getElementById('timeDisplay');
                
                if (duration > 0) {
                    const percent = (current / duration) * 100;
                    scrubber.value = percent;
                    scrubber.setAttribute('aria-valuenow', Math.round(percent));
                    timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
                    
                    if (Math.abs(current - lastSyncTime) >= 5) {
                        lastSyncTime = current;
                        fetch('/api/artifacts/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                path: '/mnt/c/Users/michael/Documents/devcore/sandbox/static/playback_state.json',
                                content: JSON.stringify({ video_id: VIDEO_ID, timestamp: Math.floor(current) }, null, 4),
                                append: false
                            })
                        }).catch(e => {});
                    }
                }
            }
        }

        function onPlayerReady(event) {
            try {
                const titleEl = document.getElementById('videoTitle');
                if (titleEl && titleEl.style.display !== 'none') {
                    titleEl.focus();
                }
            } catch(e) { logToAgent('Focus failed: ' + e); }
            
            const btnPlayPause = document.getElementById('btnPlayPause');
            const btnRewind = document.getElementById('btnRewind');
            const btnForward = document.getElementById('btnForward');
            const btnFullscreen = document.getElementById('btnFullscreen');
            const speedSelect = document.getElementById('speedSelect');
            const scrubber = document.getElementById('scrubber');

            // Play / Pause
            btnPlayPause.addEventListener('click', () => {
                logToAgent(`btnPlayPause clicked! isPlaying=${isPlaying}`);
                try {
                    if (isPlaying) {
                        player.pauseVideo();
                        logToAgent("Called pauseVideo()");
                    } else {
                        player.playVideo();
                        logToAgent("Called playVideo()");
                    }
                } catch(err) {
                    logToAgent(`Error on click: ${err.message}`);
                }
            });

            // Rewind / Forward
            btnRewind.addEventListener('click', () => {
                player.seekTo(player.getCurrentTime() - 10, true);
                document.getElementById('timeDisplay').textContent = "Rewound 10 seconds";
            });
            btnForward.addEventListener('click', () => {
                player.seekTo(player.getCurrentTime() + 10, true);
                document.getElementById('timeDisplay').textContent = "Skipped 10 seconds";
            });

            // Speed
            speedSelect.addEventListener('change', (e) => {
                player.setPlaybackRate(parseFloat(e.target.value));
            });

            // Scrubber
            scrubber.addEventListener('input', (e) => {
                const duration = player.getDuration();
                const seekTo = (e.target.value / 100) * duration;
                player.seekTo(seekTo, true);
            });

            // Fullscreen
            btnFullscreen.addEventListener('click', () => {
                const iframe = document.querySelector('.video-wrapper iframe');
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) { /* Safari */
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) { /* IE11 */
                    iframe.msRequestFullscreen();
                }
            });

            // Scrubber sync
            scrubberInterval = setInterval(updateScrubber, 1000);
        }

        function onPlayerStateChange(event) {
            const btnPlayPause = document.getElementById('btnPlayPause');
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                btnPlayPause.textContent = {{ ui.media_player.btn_pause | tojson | safe }};
                btnPlayPause.setAttribute('aria-label', {{ ui.media_player.btn_pause_aria | tojson | safe }});
            } else {
                isPlaying = false;
                btnPlayPause.textContent = {{ ui.media_player.btn_play | tojson | safe }};
                btnPlayPause.setAttribute('aria-label', {{ ui.media_player.btn_play_aria | tojson | safe }});
                
                // Auto-advance on end
                if (event.data == YT.PlayerState.ENDED) {
                    if (currentIndex < playlistIds.length - 1) {
                        currentIndex++;
                        currentVideoId = playlistIds[currentIndex];
                        player.loadVideoById(currentVideoId);
                        document.getElementById('videoTitle').textContent = playlistData[currentIndex].title;
                        renderPlaylist();
                    }
                }
            }
        }
        
        // Setup Cross-Iframe Alt+N and Alt+B shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                if (e.repeat) return;
                if (currentIndex < playlistIds.length - 1) {
                    currentIndex++;
                    currentVideoId = playlistIds[currentIndex];
                    document.getElementById('errorFallback').style.display = 'none';
                    if (player && typeof player.loadVideoById === 'function') player.loadVideoById(currentVideoId);
                    document.getElementById('videoTitle').textContent = playlistData[currentIndex].title;
                    renderPlaylist();
                } else {
                    logToAgent("End of playlist reached.");
                }
            } else if (e.altKey && e.key.toLowerCase() === 'b') {
                e.preventDefault();
                if (e.repeat) return;
                if (currentIndex > 0) {
                    currentIndex--;
                    currentVideoId = playlistIds[currentIndex];
                    document.getElementById('errorFallback').style.display = 'none';
                    if (player && typeof player.loadVideoById === 'function') player.loadVideoById(currentVideoId);
                    document.getElementById('videoTitle').textContent = playlistData[currentIndex].title;
                    renderPlaylist();
                } else {
                    logToAgent("Beginning of playlist reached.");
                }
            }
        });
    </script>
</body>
</html>
